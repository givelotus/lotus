name: Build & Release Lotus Daemon (with Chronik)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional label; must match daemon/release-version'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build lotusd (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-linux-gnu
          - os: macos-14
            target: arm64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release label against source
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        shell: bash
        run: |
          VERSION="v$(cat daemon/release-version)"
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "$VERSION" ]]
          fi
          [[ -z "$REQUESTED_TAG" || "$REQUESTED_TAG" == "$VERSION" ]]
          echo "LOTUS_RELEASE_TAG=$VERSION" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy

      - name: Install Python supported by Chronik's PyO3 bindings
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Test release preparation without network or daemon state
        run: |
          python3 -m unittest discover -s daemon/scripts -p 'test_prepare_release.py' -v
          python3 -m unittest discover -s daemon/tests -p 'test_prepare_network_release.py' -v

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config git python3 \
            libboost-all-dev libssl-dev libevent-dev libdb++-dev \
            libsqlite3-dev libjemalloc-dev libflatbuffers-dev flatbuffers-compiler \
            libprotobuf-dev protobuf-compiler libclang-dev libutf8proc-dev curl
          # Build and install static libnng with CMake config (nng::nng)
          git clone --depth 1 --branch v1.9.0 https://github.com/nanomsg/nng.git /tmp/nng
          cmake -S /tmp/nng -B /tmp/nng/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DNNG_TESTS=OFF \
            -DNNG_TOOLS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          sudo cmake --build /tmp/nng/build --target install

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install berkeley-db boost cmake dylibbundler flatbuffers jemalloc \
            libevent nng ninja openssl protobuf sqlite utf8proc

      - name: Setup Bitcoin ABC workspace and apply Lotus V1 patch series
        run: |
          make -C daemon setup SERIES=v1

      - name: Check release metadata and package replayed source
        shell: bash
        run: |
          if [[ -f daemon/release-manifest.json ]]; then
            python3 daemon/scripts/prepare-release.py --upstream daemon/workspace-v1 --check
          else
            echo "Historical source has no prepared release manifest; exporting the actual replayed tree."
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            mkdir -p dist
            if [[ -f daemon/release-manifest.json ]]; then
              python3 daemon/scripts/prepare-release.py --upstream daemon/workspace-v1 --check \
                --archive "dist/lotus-${LOTUS_RELEASE_TAG}-source.tar.gz"
            else
              git -C daemon/workspace-v1 archive --format=tar.gz --prefix="lotus-${LOTUS_RELEASE_TAG}/" HEAD \
                > "dist/lotus-${LOTUS_RELEASE_TAG}-source.tar.gz"
            fi
            (cd dist && shasum -a 256 "lotus-${LOTUS_RELEASE_TAG}-source.tar.gz" > "lotus-${LOTUS_RELEASE_TAG}-source.tar.gz.sha256")
          fi

      - name: Build lotusd and lotus-cli (with in-process Chronik)
        env:
          PYO3_PYTHON: python3
        run: |
          SERIES=v1 daemon/scripts/build.sh -DPython_EXECUTABLE="$(command -v python3)" -DRust_TOOLCHAIN=1.93.0
          ./daemon/workspace-v1/build/src/lotusd --version
          ./daemon/workspace-v1/build/src/lotus-cli --version

      - name: Check C++ and Rust suites before packaging
        env:
          PYO3_PYTHON: python3
        run: |
          ninja -C daemon/workspace-v1/build -j2 test_lotus check-crates
          ninja -C daemon/workspace-v1/build -j2 check-bitcoin

      - name: Package release archive
        shell: bash
        run: |
          VERSION="$LOTUS_RELEASE_TAG"
          PKG_NAME="lotus-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}/bin"
          for EVIDENCE in daemon/release-manifest.json daemon/release-network.json; do
            [[ ! -f "$EVIDENCE" ]] || cp "$EVIDENCE" dist/
          done
          cp daemon/workspace-v1/build/src/lotusd "dist/${PKG_NAME}/bin/"
          cp daemon/workspace-v1/build/src/lotus-cli "dist/${PKG_NAME}/bin/"
          cp README.md "dist/${PKG_NAME}/"
          cp daemon/workspace-v1/COPYING "dist/${PKG_NAME}/"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            mkdir -p "dist/${PKG_NAME}/lib"
            dylibbundler -od -b \
              -x "dist/${PKG_NAME}/bin/lotusd" \
              -x "dist/${PKG_NAME}/bin/lotus-cli" \
              -d "dist/${PKG_NAME}/lib/" \
              -p "@executable_path/../lib/"
            for LIBRARY in "dist/${PKG_NAME}/lib/"*; do
              [[ -f "$LIBRARY" ]] || continue
              codesign --force --sign - "$LIBRARY"
            done
            codesign --force --sign - "dist/${PKG_NAME}/bin/lotusd"
            codesign --force --sign - "dist/${PKG_NAME}/bin/lotus-cli"
            codesign --verify --strict "dist/${PKG_NAME}/bin/lotusd"
            codesign --verify --strict "dist/${PKG_NAME}/bin/lotus-cli"
          else
            strip "dist/${PKG_NAME}/bin/lotusd" "dist/${PKG_NAME}/bin/lotus-cli"
          fi

          "dist/${PKG_NAME}/bin/lotusd" --version | tee "dist/${PKG_NAME}/daemon-version.txt"
          grep -F "${VERSION#v}" "dist/${PKG_NAME}/daemon-version.txt"
          "dist/${PKG_NAME}/bin/lotus-cli" --version
          cd dist
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Smoke prepared Linux container without publishing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -f daemon/release-manifest.json ]]; then
            PKG_NAME="lotus-${LOTUS_RELEASE_TAG}-${{ matrix.target }}"
            CONTEXT="$(mktemp -d)"
            cp daemon/workspace-v1/contrib/docker/lotus/Dockerfile "$CONTEXT/"
            cp "dist/${PKG_NAME}.tar.gz" "$CONTEXT/"
            docker build --build-arg "RELEASE_ARCHIVE=${PKG_NAME}.tar.gz" -t lotus-candidate:test "$CONTEXT"
            docker run --rm --network none lotus-candidate:test lotusd --version
            docker run --rm --network none lotus-candidate:test lotus-cli --version
          else
            echo "No prepared container candidate in historical source; container build not claimed."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lotus-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.json

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined SHA256SUMS
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
            release-assets/release-manifest.json
            release-assets/release-network.json
          body: |
            ## Lotus Daemon `${{ github.ref_name }}` (with In-Process Chronik)

            Prebuilt `lotusd` and `lotus-cli` binaries for Lotus V1 mainnet, rebased onto modern Bitcoin ABC (`8c67fe1e85`) with the **in-process Rust/C++ Chronik indexer** compiled in (`-DBUILD_CHRONIK=ON`).

            ### Quick Start (with Chronik enabled)
            ```bash
            ./bin/lotusd -chronik=1 -daemon
            ```
            - **Mainnet P2P**: `10605`
            - **Mainnet JSON-RPC**: `10604`
            - **Chronik HTTP / WebSocket**: `127.0.0.1:8331` (override via `-chronikbind=<ip:port>`)
