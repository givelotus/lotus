name: Build and package miner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'miner/**'
      - '.github/workflows/build-miner.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: miner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config ocl-icd-opencl-dev libssl-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Install scoped Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
      - name: Check source and CPU protocol tests
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Build native CLI and desktop package
        run: python3 scripts/package.py
      - name: Verify extracted package
        run: python3 scripts/check-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: lotus-miner-${{ matrix.os }}
          path: miner/dist/*
          if-no-files-found: error
