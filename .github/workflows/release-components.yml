name: Daemon component artifacts and releases

on:
  workflow_dispatch:
    inputs:
      component:
        description: Reviewed component manifest to build (artifact only)
        required: true
        type: choice
        options: [lotusd, bchn, doged, bitcoin-core]
  push:
    tags:
      - 'lotusd-v[0-9]*'
      - 'bchn-v[0-9]*'
      - 'doged-v[0-9]*'
      - 'bitcoin-core-v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-linux-gnu}
          - {os: macos-15, target: arm64-apple-darwin}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Select supported macOS compiler
        if: runner.os == 'macOS'
        run: |
          echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
          DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer xcodebuild -version
      - uses: actions/checkout@v4
      - name: Resolve explicit component manifest
        id: component
        env:
          REQUESTED_COMPONENT: ${{ inputs.component }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          components=json.loads(pathlib.Path('daemon/components.json').read_text())['components']
          component=os.environ.get('REQUESTED_COMPONENT','')
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              tag=os.environ['GITHUB_REF_NAME']
              matched=[name for name,config in components.items() if config.get('release_enabled',True) and re.fullmatch(re.escape(name)+r'-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)',tag)]
              assert len(matched)==1, 'Invalid component tag'
              component=matched[0]
          assert component in components
          assert components[component].get('release_enabled',True), f'{component} is a source provider, not a network release'
          manifest=json.loads(pathlib.Path(f'daemon/releases/{component}/manifest.json').read_text())
          assert manifest['component']==component
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert manifest['tag']==os.environ['GITHUB_REF_NAME']
          chronik_flags = [flag for flag in manifest.get('cmake_args', [])
                           if flag.startswith('-DBUILD_CHRONIK=')]
          chronik = bool(chronik_flags) and chronik_flags[-1] == '-DBUILD_CHRONIK=ON'
          assert chronik, f'{component} release must select an in-process Chronik profile'
          config=components[component]
          assert config['rust'] in (None, '1.87.0', '1.93.0'), 'Missing explicit Rust installer for component'
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              host=manifest.get('chronik_host',{})
              for key,value in [('name',component),('remote',config['remote']),('pin',manifest['upstream_commit']),('tag',manifest['tag']),('rust',config['rust'] or ''),('chronik_provider_pin',host.get('provider_upstream_commit',''))]:
                  print(f'{key}={value}',file=stream)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.93.0
        if: steps.component.outputs.rust == '1.93.0'
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@1.87.0
        if: steps.component.outputs.rust == '1.87.0'
        with:
          components: clippy
      - name: Offline release tooling tests
        run: |
          python3 -m unittest discover -s daemon/scripts -p 'test*release*.py' -v
          python3 -m unittest discover -s daemon/scripts/tests -p 'test_upstream_refresh.py' -v
          python3 -m unittest discover -s daemon/tests -p 'test_feature_plan.py' -v
      - name: Linux native dependencies
        if: runner.os == 'Linux' && steps.component.outputs.name != 'lotusd'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git libboost-all-dev libssl-dev libevent-dev libdb++-dev libsqlite3-dev libjemalloc-dev libflatbuffers-dev flatbuffers-compiler libprotobuf-dev protobuf-compiler libclang-dev libutf8proc-dev libzmq3-dev curl
          git init /tmp/nng
          git -C /tmp/nng remote add origin https://github.com/nanomsg/nng.git
          git -C /tmp/nng fetch --depth 1 origin 29aff2bacc9e2cfa6dcc52155d2816582617f918
          git -C /tmp/nng checkout --detach FETCH_HEAD
          cmake -S /tmp/nng -B /tmp/nng/build -GNinja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DNNG_TESTS=OFF -DNNG_TOOLS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          sudo cmake --build /tmp/nng/build --target install
      - name: macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install berkeley-db boost cmake dylibbundler flatbuffers jemalloc libevent nng ninja openssl protobuf sqlite utf8proc zeromq
      - name: Fetch pinned upstream without component tags
        env:
          UPSTREAM_REMOTE: ${{ steps.component.outputs.remote }}
          UPSTREAM_PIN: ${{ steps.component.outputs.pin }}
        run: |
          git init /tmp/component-upstream
          git -C /tmp/component-upstream remote add origin "$UPSTREAM_REMOTE"
          git -C /tmp/component-upstream fetch --no-tags origin "$UPSTREAM_PIN"
          git -C /tmp/component-upstream checkout --detach FETCH_HEAD
      - name: Verify and materialize exact source
        env:
          COMPONENT: ${{ steps.component.outputs.name }}
        run: python3 daemon/scripts/component-release.py --component "$COMPONENT" --upstream /tmp/component-upstream --materialize "$RUNNER_TEMP/component-source"
      - name: Fetch and export pinned shared Chronik
        if: steps.component.outputs.chronik_provider_pin != ''
        env:
          PROVIDER_PIN: ${{ steps.component.outputs.chronik_provider_pin }}
        run: |
          git init /tmp/chronik-upstream
          git -C /tmp/chronik-upstream remote add origin https://github.com/Bitcoin-ABC/bitcoin-abc.git
          git -C /tmp/chronik-upstream fetch --no-tags origin "$PROVIDER_PIN"
          git -C /tmp/chronik-upstream checkout --detach FETCH_HEAD
          python3 daemon/scripts/export-chronik.py --upstream /tmp/chronik-upstream --output "$RUNNER_TEMP/chronik-export"
          echo "CHRONIK_EXPORT=$RUNNER_TEMP/chronik-export" >> "$GITHUB_ENV"
      - name: Install host Chronik regtest dependencies
        if: steps.component.outputs.chronik_provider_pin != ''
        env:
          COMPONENT: ${{ steps.component.outputs.name }}
        run: |
          python3 -m pip install --user -r "daemon/chronik/hosts/$([[ "$COMPONENT" == bchn ]] && echo bchn || echo bitcoin-core)/tests/requirements.txt"
      - name: Native build, test and package
        if: steps.component.outputs.name != 'lotusd' || matrix.target != 'x86_64-linux-gnu'
        env:
          COMPONENT: ${{ steps.component.outputs.name }}
          PYO3_PYTHON: python3
        run: |
          args=()
          [[ -z "${CHRONIK_EXPORT:-}" ]] || args+=(--chronik-export "$CHRONIK_EXPORT")
          python3 daemon/scripts/component-build.py --component "$COMPONENT" --source "$RUNNER_TEMP/component-source" --dist dist --target '${{ matrix.target }}' --jobs 2 "${args[@]}"
      - name: Container packaging smoke
        if: runner.os == 'Linux' && steps.component.outputs.name != 'lotusd'
        env:
          COMPONENT: ${{ steps.component.outputs.name }}
          RELEASE_TAG: ${{ steps.component.outputs.tag }}
        run: |
          cp "daemon/releases/$COMPONENT/Dockerfile" dist/Dockerfile
          docker build --build-arg "RELEASE_ARCHIVE=$RELEASE_TAG-${{ matrix.target }}.tar.gz" -t component-candidate:test dist
          docker run --rm --network none component-candidate:test --version
      - uses: actions/upload-artifact@v4
        if: steps.component.outputs.name != 'lotusd' || matrix.target != 'x86_64-linux-gnu'
        with:
          name: ${{ steps.component.outputs.name }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.json
            dist/NOTES.md
            dist/Dockerfile

  guix-lotus-linux:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/lotusd-v')) || (github.event_name == 'workflow_dispatch' && inputs.component == 'lotusd') }}
    uses: ./.github/workflows/guix-daemon.yml
    with:
      component: lotusd
      publish_component_artifact: true

  release:
    needs: [build, guix-lotus-linux]
    if: ${{ always() && github.event_name == 'push' && needs.build.result == 'success' && (needs.guix-lotus-linux.result == 'success' || needs.guix-lotus-linux.result == 'skipped') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: component-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify mainline tag and immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          RELEASE_COMPONENT=$(python3 - <<'PY'
          import json, os, pathlib, re
          components = json.loads(pathlib.Path('daemon/components.json').read_text())['components']
          tag = os.environ['GITHUB_REF_NAME']
          version_pattern = r'-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          matched = [
              name for name, config in components.items()
              if config.get('release_enabled', True) and re.fullmatch(re.escape(name) + version_pattern, tag)
          ]
          assert len(matched) == 1, 'Invalid component tag'
          print(matched[0])
          PY
          )
          MANIFEST="daemon/releases/$RELEASE_COMPONENT/manifest.json"
          jq -e --arg component "$RELEASE_COMPONENT" --arg tag "$GITHUB_REF_NAME" '.component==$component and .tag==$tag' "$MANIFEST"
          echo "RELEASE_COMPONENT=$RELEASE_COMPONENT" >> "$GITHUB_ENV"
          gh api --paginate repos/givelotus/lotus/releases --jq '.[].tag_name' > existing-tags.txt
          if grep -Fx "$GITHUB_REF_NAME" existing-tags.txt; then exit 1; fi
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify same-run component assets and checksums
        run: |
          cd release-assets
          test -f manifest.json
          jq -e --arg tag "$GITHUB_REF_NAME" '.tag==$tag' manifest.json
          cmp -- manifest.json "../daemon/releases/$RELEASE_COMPONENT/manifest.json"
          for target in x86_64-linux-gnu arm64-apple-darwin; do
            test -f "$GITHUB_REF_NAME-$target.tar.gz"
            test -f "build-info-$target.json"
          done
          if [[ "$RELEASE_COMPONENT" == lotusd ]]; then
            compgen -G 'lotusd_*_amd64.deb' > /dev/null
            compgen -G 'lotusd-*.rpm' > /dev/null
          fi
          cat ./*.sha256 | sort -u > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          rm -- ./*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-assets/NOTES.md
          files: |
            release-assets/*.tar.gz
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.json
            release-assets/SHA256SUMS
            release-assets/NOTES.md
            release-assets/Dockerfile
