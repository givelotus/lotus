name: Node PWA wallet

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'wallets/node-pwa/**'
      - '.github/workflows/node-pwa.yml'
  push:
    tags:
      - 'node-pwa-v*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: wallets/node-pwa
    env:
      # The smoke test needs a lotusd binary and a browser; it runs locally
      # (see README.md), not in this job.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Pinned: the bundle's gzip bytes depend on Node's zlib.
          node-version: '24.11.1'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Pack twice and compare
        run: |
          npm run pack -- --out "$RUNNER_TEMP/pack-a"
          npm run pack -- --out "$RUNNER_TEMP/pack-b"
          a=$(cut -d' ' -f1 "$RUNNER_TEMP"/pack-a/*.sha256)
          b=$(cut -d' ' -f1 "$RUNNER_TEMP"/pack-b/*.sha256)
          test "$a" = "$b"
          mkdir -p dist && cp "$RUNNER_TEMP"/pack-a/* dist/
          cat dist/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: node-pwa-bundle
          path: wallets/node-pwa/dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/node-pwa-v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: node-pwa-bundle
          path: dist
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./wallets/node-pwa/package.json').version")
          test "${GITHUB_REF_NAME}" = "node-pwa-v${version}"
          test -f "dist/node-pwa-${version}.tar.gz"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/node-pwa-*.tar.gz
            dist/node-pwa-*.tar.gz.sha256
          fail_on_unmatched_files: true
