name: Lotus Guix reproducibility candidate
on:
  workflow_dispatch:
    inputs:
      component:
        description: Exact reviewed component candidate to build
        required: true
        type: choice
        options: [lotusd]
  workflow_call:
    inputs:
      component:
        description: Exact reviewed component candidate to build
        required: true
        type: string
      publish_component_artifact:
        description: Return the verified Linux component artifact to the caller workflow
        required: false
        default: false
        type: boolean
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  dependency-preflight:
    if: ${{ inputs.publish_component_artifact != true }}
    name: GCC 14 depends and daemon configuration preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Replay Lotus and its explicit Guix build overlay
        run: |
          make -C daemon setup SERIES=v1
          source_commit=$(git -C daemon/workspace-v1 rev-parse HEAD)
          python3 daemon/scripts/patch-series.py daemon/workspace-v1 daemon/candidates/guix/series --base "$source_commit"
      - name: Check target toolchain does not leak into native recipe environments
        run: |
          make -C daemon/workspace-v1/depends CMAKE_TOOLCHAIN_FILE=/target/only \
            --eval $'check-native-cmake-environment:\n\t@test -z "$${CMAKE_TOOLCHAIN_FILE:-}"\n\t@test "$(CMAKE_TOOLCHAIN_FILE)" = /target/only' \
            check-native-cmake-environment
      - name: Compile the exact pinned headless dependency recipes with GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 cmake ninja-build autoconf automake libtool pkg-config
          CMAKE_TOOLCHAIN_FILE="$PWD/daemon/workspace-v1/cmake/platforms/Linux64.cmake"
          export CC=gcc-14 CXX=g++-14
          export CROSS_CC=gcc-14 CROSS_CXX=g++-14
          make -C daemon/workspace-v1/depends -j2 HOST=x86_64-linux-gnu NO_QT=1 NO_QR=1 NO_ZMQ=1 \
            CMAKE_TOOLCHAIN_FILE="$CMAKE_TOOLCHAIN_FILE" BASEPREFIX="$PWD/daemon/workspace-v1/depends" \
            x86_64_linux_CC=gcc-14 x86_64_linux_CXX=g++-14 \
            x86_64_linux_AR=gcc-ar-14 x86_64_linux_RANLIB=gcc-ranlib-14 \
            x86_64_linux_NM=gcc-nm-14 x86_64_linux_STRIP=strip
      - name: Check Boost integer headers with libstdc++ 14
        run: |
          g++-14 -std=gnu++20 -fsyntax-only -isystem daemon/workspace-v1/depends/x86_64-linux-gnu/include \
            -x c++ - <<<'#include <boost/multiprecision/cpp_int.hpp>'
      - uses: dtolnay/rust-toolchain@1.93.0
      - name: Configure Lotus against the built dependency prefix
        run: |
          export CROSS_CC=gcc-14 CROSS_CXX=g++-14
          export PATH="$PWD/daemon/workspace-v1/depends/x86_64-linux-gnu/native/bin:$PATH"
          cmake -S daemon/workspace-v1 -B "$RUNNER_TEMP/lotus-config-preflight" -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/daemon/workspace-v1/cmake/platforms/Linux64.cmake" \
            -DBASEPREFIX="$PWD/daemon/workspace-v1/depends" \
            -DBUILD_CHRONIK=ON -DBUILD_CHRONIK_PLUGINS=OFF -DRust_TOOLCHAIN=1.93.0 \
            -DBUILD_BITCOIN_NNG=ON -DBUILD_WALLET=ON -DBUILD_QT=OFF -DBUILD_ZMQ=OFF \
            -DBUILD_PROOF_MANAGER_CLI=OFF -DBUILD_IGUANA=OFF -DBUILD_TX=OFF -DBUILD_SEEDER=OFF
  build:
    needs: dependency-preflight
    if: ${{ always() && (inputs.publish_component_artifact == true || needs.dependency-preflight.result == 'success') }}
    name: Independent Guix Linux build ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        replica: [a, b]
    steps:
      - uses: actions/checkout@v4
      - name: Install Guix on ephemeral runner
        run: |
          # These unused SDKs exist only on this disposable hosted Linux runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y guix
          sudo systemctl start guix-daemon
          guix --version
          guix gc --list-failures
          # Ubuntu's AppArmor policy otherwise denies unprivileged containers.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Upgrade the ephemeral bootstrap daemon and substitute helper
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          bootstrap=$(cat daemon/guix-bootstrap-version)
          [[ "$bootstrap" =~ ^[0-9a-f]{40}$ ]]
          upgraded=false
          for attempt in 1 2 3; do
            echo "Guix bootstrap upgrade attempt $attempt"
            if sudo --login guix pull --url=https://codeberg.org/guix/guix.git \
              --commit="$bootstrap" --cores=2 --fallback 2>&1 | tee -a "$RUNNER_TEMP/guix-bootstrap.log"; then
              upgraded=true
              break
            fi
            sleep 5
          done
          [[ "$upgraded" == true ]]
          profile=/var/guix/profiles/per-user/root/current-guix
          client=$(sudo readlink -f "$profile/bin/guix")
          daemon=$(sudo readlink -f "$profile/bin/guix-daemon")
          [[ -x "$client" && -x "$daemon" ]]
          build_group=_guixbuild
          getent group "$build_group" > /dev/null
          sudo mkdir -p /etc/systemd/system/guix-daemon.service.d
          printf '[Service]\nExecStart=\nExecStart=%s --build-users-group=%s --discover=no\n' "$daemon" "$build_group" \
            | sudo tee /etc/systemd/system/guix-daemon.service.d/lotus-bootstrap.conf > /dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart guix-daemon
          dirname "$client" >> "$GITHUB_PATH"
          "$client" --version
          sudo "$client" describe --profile="$profile" --format=channels | tee "$RUNNER_TEMP/guix-bootstrap-channels.scm"
          "$client" gc --list-failures
      - name: Resolve exact component manifest
        id: component
        env:
          COMPONENT: ${{ inputs.component }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          component=os.environ['COMPONENT']
          assert component == 'lotusd', 'Guix release workflow currently supports Lotus only'
          config=json.loads(pathlib.Path('daemon/components.json').read_text())['components'][component]
          manifest=json.loads(pathlib.Path(f'daemon/releases/{component}/manifest.json').read_text())
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert manifest['tag'] == os.environ['GITHUB_REF_NAME'], 'Tag differs from reviewed component manifest'
          assert manifest['component'] == component
          assert '-DBUILD_CHRONIK=ON' in manifest['cmake_args']
          assert '-DBUILD_BITCOIN_NNG=ON' in manifest['cmake_args']
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              for key,value in [('name',component),('remote',config['remote']),('pin',manifest['upstream_commit']),('tag',manifest['tag'])]:
                  print(f'{key}={value}',file=stream)
          PY
      - name: Fetch exact component upstream
        env:
          UPSTREAM_REMOTE: ${{ steps.component.outputs.remote }}
          UPSTREAM_PIN: ${{ steps.component.outputs.pin }}
        run: |
          git init /tmp/component-upstream
          git -C /tmp/component-upstream remote add origin "$UPSTREAM_REMOTE"
          git -C /tmp/component-upstream fetch --no-tags origin "$UPSTREAM_PIN"
          git -C /tmp/component-upstream checkout --detach FETCH_HEAD
      - name: Materialize exact reviewed component source
        env:
          COMPONENT: ${{ steps.component.outputs.name }}
        run: |
          python3 daemon/scripts/component-release.py --component "$COMPONENT" \
            --upstream /tmp/component-upstream --materialize "$RUNNER_TEMP/component-source"
          echo "LOTUS_BUILD_SOURCE=$RUNNER_TEMP/component-source" >> "$GITHUB_ENV"
      - name: Build pinned Guix toolchain and dependency environment
        env:
          HOST: x86_64-linux-gnu
        run: |
          # Retry transient substitute TLS failures without discarding this
          # runner's already built, content-addressed store paths.
          for attempt in 1 2 3; do
            echo "Guix environment provisioning attempt $attempt"
            if guix time-machine --url=https://codeberg.org/guix/guix.git \
              --commit=c5eee3336cc1d10a3cc1c97fde2809c3451624d3 \
              --cores=2 --keep-failed --fallback -- shell \
              --manifest="$LOTUS_BUILD_SOURCE/contrib/guix/manifest.scm" \
              --container --emulate-fhs --user=bitcoinabc --writable-root \
              --pure --network --no-cwd \
              --cores=2 --keep-failed --fallback -- true 2>&1 | tee -a "$RUNNER_TEMP/guix-toolchain.log"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Build and test Lotus binaries in Guix, then smoke-test archives
        env:
          JOBS: '2'
          LOTUS_DISTNAME: ${{ steps.component.outputs.tag }}
        run: |
          daemon/scripts/guix-build.sh "$LOTUS_BUILD_SOURCE" "$RUNNER_TEMP/guix-${{ matrix.replica }}" 2>&1 | tee "$RUNNER_TEMP/guix-build.log"
      - name: Stage exact component release assets
        if: success()
        env:
          COMPONENT: ${{ steps.component.outputs.name }}
          TAG: ${{ steps.component.outputs.tag }}
          TARGET: x86_64-linux-gnu
        run: |
          raw="$RUNNER_TEMP/guix-${{ matrix.replica }}/output/$TARGET/$TAG-$TARGET.tar.gz"
          python3 daemon/scripts/guix-component-package.py \
            --source "$LOTUS_BUILD_SOURCE" --upstream /tmp/component-upstream \
            --archive "$raw" --inputs "$RUNNER_TEMP/guix-${{ matrix.replica }}/output/inputs.txt" \
            --dist "$RUNNER_TEMP/guix-${{ matrix.replica }}/release-dist" --target "$TARGET"
      - name: Container packaging smoke
        if: success()
        env:
          TAG: ${{ steps.component.outputs.tag }}
          TARGET: x86_64-linux-gnu
        run: |
          dist="$RUNNER_TEMP/guix-${{ matrix.replica }}/release-dist"
          docker build --build-arg "RELEASE_ARCHIVE=$TAG-$TARGET.tar.gz" -t lotus-guix-candidate:test "$dist"
          docker run --rm --network none lotus-guix-candidate:test --version
      - name: Preserve failed Guix derivation logs
        if: failure()
        run: |
          if [[ -d /var/log/guix/drvs ]]; then
            sudo tar -czf "$RUNNER_TEMP/guix-derivation-logs.tar.gz" -C /var/log/guix drvs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guix-linux-${{ matrix.replica }}
          path: |
            ${{ runner.temp }}/guix-${{ matrix.replica }}/output/
            ${{ runner.temp }}/guix-${{ matrix.replica }}/release-dist/
            ${{ runner.temp }}/guix-${{ matrix.replica }}/inputs.txt
            ${{ runner.temp }}/guix-build.log
            ${{ runner.temp }}/guix-toolchain.log
            ${{ runner.temp }}/guix-bootstrap.log
            ${{ runner.temp }}/guix-bootstrap-channels.scm
            ${{ runner.temp }}/guix-derivation-logs.tar.gz
          if-no-files-found: error
  compare:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: guix-linux-*
          path: replicas
      - name: Compare independent archives
        run: |
          find replicas -name SHA256SUMS -print
          first=$(find replicas/guix-linux-a -name SHA256SUMS)
          second=$(find replicas/guix-linux-b -name SHA256SUMS)
          test -n "$first" && test -n "$second"
          (cd "$(dirname "$first")" && sha256sum -c SHA256SUMS)
          (cd "$(dirname "$second")" && sha256sum -c SHA256SUMS)
          diff -u "$first" "$second"
          diff -ru replicas/guix-linux-a/release-dist replicas/guix-linux-b/release-dist
      - name: Record the independent archive comparison
        if: inputs.publish_component_artifact == true
        run: |
          info=replicas/guix-linux-a/release-dist/build-info-x86_64-linux-gnu.json
          python3 - "$info" <<'PY'
          import json, pathlib, sys
          path=pathlib.Path(sys.argv[1])
          data=json.loads(path.read_text())
          data['reproducibility']='passed; independent binary, debug and source archive hashes match'
          path.write_text(json.dumps(data,indent=2)+'\n')
          PY
          (cd replicas/guix-linux-a/release-dist && sha256sum build-info-x86_64-linux-gnu.json > build-info-x86_64-linux-gnu.json.sha256)
      - name: Stage the verified Guix release artifact
        if: inputs.publish_component_artifact == true
        run: |
          release_dist="$RUNNER_TEMP/guix-release-dist"
          mkdir -p "$release_dist"
          cp -a replicas/guix-linux-a/release-dist/. "$release_dist/"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_call'
        with:
          name: lotusd-x86_64-linux-gnu
          path: ${{ runner.temp }}/guix-release-dist/
