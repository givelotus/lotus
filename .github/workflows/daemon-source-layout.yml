name: Daemon source layout
on:
  pull_request:
    paths:
      - '.gitmodules'
      - 'daemon/sources.json'
      - 'daemon/stack-review.json'
      - 'daemon/scripts/**'
      - '.github/workflows/daemon-source-layout.yml'
  workflow_dispatch:
    inputs:
      verify_private_sources:
        description: Verify pinned submodules using DAEMON_REPOS_TOKEN
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test source routing and preservation guards without network
        run: |
          python3 -m unittest discover -s daemon/scripts/tests -p test_daemon_sources.py -v
          python3 -m unittest discover -s daemon/scripts/tests -p test_lotus_git.py -v
          python3 daemon/scripts/daemon_sources.py plan all --json > "$RUNNER_TEMP/source-plan.json"
  authenticated-checkout:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_private_sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DAEMON_REPOS_TOKEN }}
          submodules: recursive
      - name: Verify exact repos and source trees without applying stacks
        run: make -C daemon source-verify
