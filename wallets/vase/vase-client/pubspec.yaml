name: vase
description: A simple wallet.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 2.6.1+30

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  lotus_dart:
    path: ../../../sdk/dart

  cupertino_icons: ^2.0.0
  qr_flutter: ^4.1.0
  web_socket_channel: ^3.0.3
  json_annotation: ^4.12.0
  hex: ^0.2.0
  pointycastle: ^4.0.0
  collection: ^1.19.1
  sprintf: ^7.0.0
  unorm_dart: ^0.3.3
  buffer: ^1.2.3
  provider: ^6.1.5+1
  # Migration bridge: v11 removes legacy algorithms before old wallets can migrate.
  flutter_secure_storage: 10.3.4
  pool: ^1.5.3
  sentry_flutter: ^10.0.0
  flutter_hooks: ^0.21.3+1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  go_router: ^18.1.0
  intl: ^0.20.3
  slide_to_confirm: ^1.1.0
  mobile_scanner: ^7.4.2
  location: ^10.0.2
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  http: ^1.6.0
  flutter_contacts: ^2.6.0

dev_dependencies:
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  test: ^1.31.1
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: assets/icon/app_icon_android.png
  image_path_ios: assets/icon/app_icon_ios.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: Brandon
      fonts:
        - asset: assets/fonts/Brandon-Regular.otf
        - asset: assets/fonts/Brandon-Medium.otf
          weight: 500
        - asset: assets/fonts/Brandon-Bold.otf
          weight: 700
