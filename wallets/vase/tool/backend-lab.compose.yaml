name: vase-wallet-lab
services:
  database:
    image: postgis/postgis:18-3.6@sha256:7e00e8c3539fdd43f513b98806c8204714dcd09dea683c259e333d7690317119
    platform: linux/amd64
    environment:
      POSTGRES_USER: vase_lab
      POSTGRES_PASSWORD: isolated-local-fixture
      POSTGRES_DB: vase_lab
    ports:
      - '127.0.0.1:25432:5432'
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vase_lab -d vase_lab']
      interval: 2s
      timeout: 5s
      retries: 30
  server:
    image: debian:bookworm-slim
    command: ['/app/server']
    volumes:
      - ${VASE_LAB_BIN:?Set VASE_LAB_BIN to the directory containing Linux server and migrate binaries}:/app:ro
    environment:
      DB_STRING: postgres://vase_lab:isolated-local-fixture@database:5432/vase_lab?sslmode=disable
      PORT: '8080'
    ports:
      - '127.0.0.1:28080:8080'
    depends_on:
      database:
        condition: service_healthy
  migrate:
    image: debian:bookworm-slim
    command: ['/app/migrate']
    volumes:
      - ${VASE_LAB_BIN:?Set VASE_LAB_BIN to the directory containing Linux server and migrate binaries}:/app:ro
    environment:
      DB_STRING: postgres://vase_lab:isolated-local-fixture@database:5432/vase_lab?sslmode=disable
    profiles: ['tools']
    depends_on:
      database:
        condition: service_healthy
volumes:
  database:
