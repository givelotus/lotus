# Default chain preserves Lotus behavior. Use a separate config for Dogecoin.
chain = "lotus"
# Dogecoin only: power-of-two 256..4096, independent of Lotus kernel_size.
scrypt_work_size = 1024
# Put your own mainnet lotus_ payout address here before mining.
mine_to_address = ""
rpc_url = "http://127.0.0.1:10604"
rpc_poll_interval = 3
rpc_user = "lotus"
rpc_password = "replace-with-your-node-rpc-password"
gpu_index = 0
kernel_size = 21
