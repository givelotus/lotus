# Root contracts Payer and Receiver both consume policy@1.0.0.
[package]
name = "pay"
version = "0.1.0"
kind = "contract"
source = "src"
entry = "main"
modules = ["main"]

[dependencies]
policy = "policy@1.0.0"

# Root-only local locator. The library manifest cannot override it.
[sources]
policy = "packages/policy"
