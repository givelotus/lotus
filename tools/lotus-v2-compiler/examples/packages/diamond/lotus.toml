# Root contract package: app -> lib_a, lib_b; lib_a, lib_b -> core (diamond).
[package]
name = "app"
version = "0.1.0"
kind = "contract"
source = "src"
entry = "main"
modules = ["main", "policy"]

[dependencies]
lib_a = "lib_a@1.0.0"
lib_b = "lib_b@1.0.0"

# Root-only local locators (relative to this directory). Dependency manifests
# cannot add or override locators.
[sources]
core = "packages/core"
lib_a = "packages/lib_a"
lib_b = "packages/lib_b"
