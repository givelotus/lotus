# Quoted module path plus a path library. The replace keeps the schema-2 lock offline.
[package]
name = "pay"
version = "0.1.0"
kind = "contract"
source = "src"
entry = "main"
modules = ["main"]

[dependencies]
policy = "policy@1.0.0"

[sources]
policy = "packages/policy"

[replace]
"github.com/acme/lotus-std" = "packages/std"
