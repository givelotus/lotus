# These environment variables are set by the build process and read by
# test/functional/test_runner.py and test/util/bitcoin-util-test.py

[environment]
PACKAGE_NAME=Lotus
PACKAGE_BUGREPORT=https://github.com/givelotus/lotus/issues
SRCDIR=/Users/shammah/repos/lotus-v2-repair-work/rpc-lazy-overlay-source
BUILDDIR=/Users/shammah/repos/lotus-v2-repair-work/rpc-lazy-overlay-build
EXEEXT=
RPCAUTH=/Users/shammah/repos/lotus-v2-repair-work/rpc-lazy-overlay-source/share/rpcauth/rpcauth.py
EMULATOR=

[components]
# Which components are enabled. Note that bitcoind cannot be disabled by cmake
# and so is always ON.
ENABLE_WALLET=ON
ENABLE_WALLET_TOOL=ON
ENABLE_CLI=ON
ENABLE_BITCOIND=ON
ENABLE_FUZZ=OFF
ENABLE_CHRONIK=OFF
ENABLE_WEBTRANSPORT=OFF
ENABLE_CHRONIK_PLUGINS=OFF
ENABLE_CHRONIK_NATIVE=OFF
ENABLE_CHRONIK_ELECTRUM=OFF
ENABLE_HTTP2=OFF
ENABLE_USDT_TRACEPOINTS=OFF
